  function openCameraUI(canvas, ctx) {
    camState = {
      canvas: canvas, ctx: ctx,
      rx: canvas.width / 2, ry: canvas.height / 2,
      wb: null, wbMode: false, hex: '', name: ''
    };
    var h = '';
    h += '<p class="hint" id="cam-hint">Tap or drag the reticle on the filament. The app averages a 15\u00d715 pixel patch and ignores the brightest 10% (specular highlights).</p>';
    h += '<div class="cam-stage" id="cam-stage"></div>';
    h += '<div class="cam-tools">';
    h += '<button type="button" class="btn" id="btn-wb">White balance: tap a white or gray card</button>';
    h += '<button type="button" class="btn" id="btn-wb-clear">Clear white balance</button>';
    h += '<span id="wb-status"></span></div>';
    h += '<div class="sample-preview"><div class="big-swatch" id="cam-swatch"></div><div>';
    h += '<div><strong id="cam-name">\u2014</strong></div>';
    h += '<div class="color-row" style="margin-top:8px">';
    h += '<input type="color" id="cam-picker" value="#FFFFFF">';
    h += '<input type="text" id="cam-hex" value="" placeholder="#RRGGBB" spellcheck="false" maxlength="9">';
    h += '</div></div></div>';
    document.getElementById('camera-body').innerHTML = h;
    var stage = document.getElementById('cam-stage');
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    canvas.style.maxHeight = '62vh';
    canvas.id = 'cam-canvas';
    stage.appendChild(canvas);
    var ret = document.createElement('div');
    ret.className = 'reticle';
    ret.id = 'cam-reticle';
    ret.innerHTML = '<div class="ring"></div>';
    stage.appendChild(ret);
    openPanel('panel-camera');
    setTimeout(function () { positionReticle(); resample(); }, 50);

    function canvasPoint(evt) {
      var rect = canvas.getBoundingClientRect();
      var x = (evt.clientX - rect.left) / rect.width * canvas.width;
      var y = (evt.clientY - rect.top) / rect.height * canvas.height;
      if (x < 0) x = 0;
      if (y < 0) y = 0;
      if (x > canvas.width) x = canvas.width;
      if (y > canvas.height) y = canvas.height;
      return {x: x, y: y};
    }
    function positionReticle() {
      var rect = canvas.getBoundingClientRect();
      var stageRect = stage.getBoundingClientRect();
      var px = rect.left - stageRect.left + (camState.rx / canvas.width) * rect.width;
      var py = rect.top - stageRect.top + (camState.ry / canvas.height) * rect.height;
      ret.style.left = px + 'px';
      ret.style.top = py + 'px';
    }
    function resample() {
      var rgb = samplePatch(ctx, camState.rx, camState.ry, PATCH, camState.wb);
      if (!rgb) return;
      var hex = rgbToHex(rgb.r, rgb.g, rgb.b);
      var name = nearestColorName(hex);
      camState.hex = hex;
      camState.name = name;
      document.getElementById('cam-swatch').style.background = hex;
      document.getElementById('cam-name').textContent = name;
      document.getElementById('cam-hex').value = hex;
      document.getElementById('cam-picker').value = hex.toLowerCase();
    }
    camState.resample = resample;
    camState.positionReticle = positionReticle;
    var dragging = false;
    function onDown(evt) {
      evt.preventDefault();
      dragging = true;
      if (stage.setPointerCapture && evt.pointerId != null) {
        try { stage.setPointerCapture(evt.pointerId); } catch (e) {}
      }
      var p = canvasPoint(evt);
      camState.rx = p.x;
      camState.ry = p.y;
      if (camState.wbMode) {
        var ref = samplePatch(ctx, camState.rx, camState.ry, PATCH, null);
        if (ref) {
          camState.wb = gainsFromReference(ref);
          camState.wbMode = false;
          document.getElementById('wb-status').innerHTML = '<span class="wb-on">White balance on</span>';
          document.getElementById('cam-hint').textContent = 'White balance set. Now tap the filament to sample its color.';
        }
      }
      positionReticle();
      resample();
    }
    function onMove(evt) {
      if (!dragging) return;
      evt.preventDefault();
      var p = canvasPoint(evt);
      camState.rx = p.x;
      camState.ry = p.y;
      positionReticle();
      resample();
    }
    function onUp() { dragging = false; }
    stage.addEventListener('pointerdown', onDown);
    stage.addEventListener('pointermove', onMove);
    stage.addEventListener('pointerup', onUp);
    stage.addEventListener('pointercancel', onUp);
    stage.addEventListener('mousedown', onDown);
    stage.addEventListener('mousemove', function (e) { if (dragging) onMove(e); });
    stage.addEventListener('mouseup', onUp);
    stage.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0]) { onDown(e.touches[0]); e.preventDefault(); }
    }, {passive: false});
    stage.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches[0]) { onMove(e.touches[0]); e.preventDefault(); }
    }, {passive: false});
    stage.addEventListener('touchend', onUp);
    document.getElementById('btn-wb').addEventListener('click', function () {
      camState.wbMode = true;
      document.getElementById('cam-hint').textContent = 'Tap a white or gray reference (for example a paper card) to correct the color cast.';
      document.getElementById('wb-status').textContent = 'Tap the card\u2026';
    });
    document.getElementById('btn-wb-clear').addEventListener('click', function () {
      camState.wb = null;
      camState.wbMode = false;
      document.getElementById('wb-status').textContent = '';
      document.getElementById('cam-hint').textContent = 'Tap or drag the reticle on the filament.';
      resample();
    });
    document.getElementById('cam-hex').addEventListener('change', function () {
      var n = normalizeHex(this.value);
      if (n) {
        camState.hex = n;
        camState.name = nearestColorName(n);
        document.getElementById('cam-swatch').style.background = n;
        document.getElementById('cam-name').textContent = camState.name;
        document.getElementById('cam-picker').value = n.toLowerCase();
        this.value = n;
      }
    });
    document.getElementById('cam-picker').addEventListener('input', function () {
      var n = normalizeHex(this.value);
      camState.hex = n;
      camState.name = nearestColorName(n);
      document.getElementById('cam-swatch').style.background = n;
      document.getElementById('cam-name').textContent = camState.name;
      document.getElementById('cam-hex').value = n;
    });
  }
  function loadPhotoFile(file) {
    if (!file) return;
    var url = URL.createObjectURL(file);

    img.onload = function () {

      var result = downscaleImageToCanvas(img, PHOTO_MAX);

  var scanTimer = null;

  function prepareScanAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!scanAudioCtx) scanAudioCtx = new Ctx();
      if (scanAudioCtx.state === 'suspended' && scanAudioCtx.resume) scanAudioCtx.resume();
    } catch (e) {}
  }

  function scanFeedback() {
    try {
      if (navigator.vibrate) navigator.vibrate(80);
    } catch (e1) {}
    try {
      if (!scanAudioCtx) return;
      var ctx = scanAudioCtx;
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.16);
    } catch (e2) {}
  }

  function zxingHints() {
    var Z = window.ZXing;
    var hints = new Map();
    var formats = [
      Z.BarcodeFormat.QR_CODE,
      Z.BarcodeFormat.DATA_MATRIX,
      Z.BarcodeFormat.AZTEC,
      Z.BarcodeFormat.PDF_417,
      Z.BarcodeFormat.UPC_A,
      Z.BarcodeFormat.UPC_E,
      Z.BarcodeFormat.EAN_8,
      Z.BarcodeFormat.EAN_13,
      Z.BarcodeFormat.CODE_128,
      Z.BarcodeFormat.CODE_39,
      Z.BarcodeFormat.CODE_93,
      Z.BarcodeFormat.ITF,
      Z.BarcodeFormat.CODABAR
    ];
    if (Z.BarcodeFormat.RSS_14) formats.push(Z.BarcodeFormat.RSS_14);
    if (Z.BarcodeFormat.RSS_EXPANDED) formats.push(Z.BarcodeFormat.RSS_EXPANDED);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    if (Z.DecodeHintType.ALSO_INVERTED != null) {
      hints.set(Z.DecodeHintType.ALSO_INVERTED, true);
    }
    return hints;
  }

  function resultFromZxing(result) {
    if (!result) return null;
    var text = '';
    var format = '';
    try { text = result.getText ? result.getText() : String(result.text || ''); } catch (e) { text = String(result.text || ''); }
    try { format = result.getBarcodeFormat ? String(result.getBarcodeFormat()) : String(result.format || ''); } catch (e2) {}
    if (!trim(text)) return null;
    return { text: text, format: format };
  }

  function decodeFromCanvas(canvas) {
    var Z = window.ZXing;
    if (!Z || !canvas || !canvas.width || !canvas.height) return null;
    var hints, reader, source, bitmap, result, inverted;
    hints = zxingHints();
    function attempt(src, binarizer) {
      reader = new Z.MultiFormatReader();
      reader.setHints(hints);
      bitmap = new Z.BinaryBitmap(new binarizer(src));
      try {
        result = reader.decode(bitmap);
      } catch (e) {
        result = null;
      }
      try { if (reader.reset) reader.reset(); } catch (e2) {}
      return resultFromZxing(result);
    }
    try {
      source = new Z.HTMLCanvasElementLuminanceSource(canvas);
    } catch (e3) {
      return decodeFromImageData(canvas);
    }
    result = attempt(source, Z.HybridBinarizer);
    if (result) return result;
    if (Z.GlobalHistogramBinarizer) {
      result = attempt(source, Z.GlobalHistogramBinarizer);
      if (result) return result;
    }
    if (source.invert) {
      try {
        inverted = source.invert();
        result = attempt(inverted, Z.HybridBinarizer);
        if (result) return result;
      } catch (e4) {}
    }
    return null;
  }

  function decodeFromImageData(canvas) {
    var Z = window.ZXing;
    if (!Z || !Z.RGBLuminanceSource) return null;
    var ctx, data, pixels, length, luminance, i, j, source, reader, hints, bitmap, result;
    try {
      ctx = canvas.getContext('2d');
      data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    } catch (e) { return null; }
    pixels = data.data;
    length = canvas.width * canvas.height;
    luminance = new Uint8ClampedArray(length);
    for (i = 0, j = 0; i < length; i++, j += 4) {
      luminance[i] = (pixels[j] * 299 + pixels[j + 1] * 587 + pixels[j + 2] * 114) / 1000;
    }
    hints = zxingHints();
    try {
      source = new Z.RGBLuminanceSource(luminance, canvas.width, canvas.height);
      reader = new Z.MultiFormatReader();
      reader.setHints(hints);
      bitmap = new Z.BinaryBitmap(new Z.HybridBinarizer(source));
      result = resultFromZxing(reader.decode(bitmap));
      if (reader.reset) reader.reset();
      return result;
    } catch (e2) {
      return null;
    }
  }

  function startScanCamera() {
    if (!window.ZXing) {
      renderScanBody({
        manualOnly: true,
        showManual: true,
        status: 'The barcode library did not load. Enter the code manually.',
        statusClass: 'err'
      });
      return;
    }
    var media = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    if (!media) {
      renderScanBody({
        manualOnly: true,
        showManual: true,
        status: 'This browser cannot open a live camera. Enter the code manually, or use a photo.',
        statusClass: 'err'
      });
      /* Still offer the photo button: re-render with a photo option even in manual-only? */
      var actions = document.querySelector('.scan-actions');
      if (actions && !document.getElementById('btn-scan-photo')) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn';
        b.id = 'btn-scan-photo';
        b.textContent = 'Use a photo';
        actions.insertBefore(b, actions.firstChild);
        b.addEventListener('click', function () {
          var input = document.getElementById('file-scan');
          input.value = '';
          input.click();
        });
      }
      return;
    }
    var constraints = { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } };
    navigator.mediaDevices.getUserMedia(constraints).then(onScanStream).catch(function () {
      return navigator.mediaDevices.getUserMedia({ audio: false, video: true }).then(onScanStream);
    }).catch(function (err) {
      var name = err && err.name ? String(err.name) : '';
      var msg = 'The camera could not be opened.';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        msg = 'Camera permission was denied. Enter the code manually, or use a photo.';
      } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
        msg = 'No camera was found. Enter the code manually, or use a photo.';
      }
      renderScanBody({ showManual: true, status: msg, statusClass: 'err' });
    });
  }

  function onScanStream(stream) {
    scanStream = stream;
    scanActive = true;
    var video = document.getElementById('scan-video');
    if (!video) {
      stopScanStream();
      return;
    }
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.muted = true;
    video.autoplay = true;
    video.srcObject = stream;
    var play = video.play();
    if (play && play.catch) play.catch(function () {});
    setScanStatus('Point the camera at a barcode\u2026');
    if (!scanCanvas) scanCanvas = document.createElement('canvas');
    if (scanTimer) clearTimeout(scanTimer);
    scanTimer = setTimeout(scanTick, 350);
  }

  function drawVideoToScanCanvas(video) {
    var w = video.videoWidth || 0;
    var h = video.videoHeight || 0;
    if (!w || !h) return null;
    var canvas = scanCanvas;
    /* Downscale large frames so older iPads stay responsive. */
    var max = 960;
    var scale = 1;
    if (w > max || h > max) scale = max / Math.max(w, h);
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    if (canvas.width !== cw) canvas.width = cw;
    if (canvas.height !== ch) canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, cw, ch);
    return canvas;
  }

  function scanTick() {
    if (!scanActive) return;
    var video = document.getElementById('scan-video');
    var canvas, result;
    if (video && video.readyState >= 2) {
      canvas = drawVideoToScanCanvas(video);
      if (canvas) {
        result = decodeFromCanvas(canvas);
        if (result) {
          applyScannedCode(result.text, result.format || 'camera');
          return;
        }
      }
    }
    scanTimer = setTimeout(scanTick, 280);
  }

  function loadScanPhoto(file) {
    if (!file) return;
    if (!window.ZXing) {
      setScanStatus('The barcode library did not load.', 'err');
      return;
    }
    setScanStatus('Reading photo\u2026');
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scaled = downscaleImageToCanvas(img, 1600);
      URL.revokeObjectURL(url);
      var result = decodeFromCanvas(scaled.canvas || scaled);
      if (result) applyScannedCode(result.text, result.format || 'photo');
      else setScanStatus('No barcode found in that photo. Try a closer, sharper picture, or enter the code manually.', 'err');
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      setScanStatus('Could not open that photo.', 'err');
    };
    img.src = url;
  }

  function applyScannedCode(text, format) {
    var raw = String(text == null ? '' : text);

    scanActive = false;

    showScanHit(raw, format);

    var parsed = parseBarcodePayload(raw);

        applyParsedFields(it, parsed, true);

  function csvBlob() {

  function downloadCsv() {
    var f = csvBlob();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(f.blob);
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {

  function copyCsv() {
    var f = csvBlob();
    var ta = document.getElementById('csv-text');
    if (ta) ta.value = f.csv;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(f.csv).then(function () {

      }).catch(function () { fallbackCopy(f.csv); });
    } else {
      fallbackCopy(f.csv);

  function fallbackCopy(text) {
    var ta = document.getElementById('csv-text');
    if (!ta) return;
    ta.value = text;
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      toast('CSV copied to the clipboard');
    } catch (e) {
      toast('Select the text below and copy it');
    }
  }
  function saveCsv() {
    var f = csvBlob();
    var ta = document.getElementById('csv-text');
    if (ta) ta.value = f.csv;
    function fallback() {
      downloadCsv();
      toast('Share was not available \u2014 downloaded, and you can copy the text below');
    }
    if (typeof File === 'undefined' || !navigator.share) { fallback(); return; }
    var file;
    try { file = new File([f.blob], f.name, {type: 'text/csv'}); }
    catch (e) { fallback(); return; }
    var shareData = {title: 'Filament Inventory', text: 'Filament inventory CSV', files: [file]};
    var can = true;
    try {
      if (navigator.canShare && !navigator.canShare({files: [file]})) can = false;
    } catch (e2) {}
    if (!can) { fallback(); return; }
    navigator.share(shareData).then(function () {
      toast('CSV handed to the share sheet');
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      fallback();
    });
  }
  function importCsvText(text) {
    var incoming = itemsFromCSV(text);
    if (!incoming.length) { toast('No rows found in that CSV'); return; }
    var byId = {}, i;
    for (i = 0; i < state.items.length; i++) byId[state.items[i].id] = i;
    var added = 0, updated = 0;
    for (i = 0; i < incoming.length; i++) {
      var it = incoming[i];
      if (it.id && byId[it.id] != null) {
        state.items[byId[it.id]] = it;
        updated += 1;
      } else {
        if (!it.id) it.id = uid();
        state.items.push(it);
        byId[it.id] = state.items.length - 1;
        added += 1;
      }
    }
    saveItems();
    renderAll();
    var ta = document.getElementById('csv-text');
    if (ta) ta.value = toCSV(state.items);
    toast('Imported: ' + added + ' added, ' + updated + ' updated');
  }

  function onMainClick(e) {
    var node = e.target;
    var rootMain = document.getElementById('main');
    var rootFilt = document.getElementById('filters');
    while (node && node !== rootMain && node !== rootFilt) {
      if (node.getAttribute) {
        if (node.getAttribute('data-weigh-save')) {
          saveWeighFromCard(node.getAttribute('data-weigh-save'));
          return;
        }
        if (node.getAttribute('data-weigh-cancel')) {
          weighingId = null;
          renderMain();
          return;
        }
        if (node.getAttribute('data-weigh')) {
          openWeigh(node.getAttribute('data-weigh'));
          return;
        }
        if (node.getAttribute('data-open')) {
          var it = findItem(node.getAttribute('data-open'));
          if (it) renderEdit(clone(it), false);
          return;
        }
        if (node.getAttribute('data-used')) { usedSpool(node.getAttribute('data-used')); return; }
        if (node.getAttribute('data-delta')) {
          bumpSealed(node.parentNode.getAttribute('data-step'), Number(node.getAttribute('data-delta')));
          return;
        }
        if (node.getAttribute('data-filter')) {
          state.settings.filter = node.getAttribute('data-filter');
          saveSettings(); renderAll(); return;
        }
        if (node.getAttribute('data-view')) {
          state.settings.view = node.getAttribute('data-view');
          saveSettings(); renderAll(); return;
        }
        if (node.getAttribute('data-low')) {
          state.settings.lowOnly = !state.settings.lowOnly;
          saveSettings(); renderAll(); return;
        }
        if (node.getAttribute('data-unknown')) {
          state.settings.unknownOnly = !state.settings.unknownOnly;
          saveSettings(); renderAll(); return;
        }
      }
      node = node.parentNode;
    }
  }
  function blankItem() {
    return {
      id: uid(), material: 'PLA', brand: 'Generic', product_line: '',
      color_name: '', color_hex: '', finish: 'basic', diameter_mm: '1.75',
      spools_sealed: '', spools_opened: '', grams_remaining: '',
      spool_capacity_g: String(state.settings.defaultCapacity || 1000),
      location: '', date_opened: '', date_dried: '', notes: '',
      presets_k1c: '', presets_k2: '', low_stock_threshold: '', seeded: '', barcode: '',
      date_weighed: ''
    };
  }
  function bind() {
    document.getElementById('filters').addEventListener('click', onMainClick);
    document.getElementById('main').addEventListener('click', onMainClick);
    document.getElementById('filters').addEventListener('change', function (e) {
      if (e.target && e.target.id === 'sort') {
        state.settings.sort = e.target.value;
        saveSettings();
        renderAll();
      }
    });
    var search = document.getElementById('search');
    var searchTimer = null;
    search.addEventListener('input', function () {
      var v = search.value;
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        state.settings.search = v;
        saveSettings();
        renderMain();
      }, 120);
    });
    document.getElementById('btn-scan').addEventListener('click', function () { openScanPanel('list'); });
    document.getElementById('btn-scan-cancel').addEventListener('click', function () { closeScanPanel(); });
    document.getElementById('file-scan').addEventListener('change', function () {
      if (this.files && this.files[0]) loadScanPhoto(this.files[0]);
    });
    document.getElementById('btn-add').addEventListener('click', function () {
      var it = blankItem();
      state.items.unshift(it);
      renderEdit(it, true);
    });
    document.getElementById('btn-rapid').addEventListener('click', renderRapid);
    document.getElementById('btn-csv').addEventListener('click', renderCsvPanel);
    document.getElementById('btn-settings').addEventListener('click', renderSettings);
    document.getElementById('btn-save-edit').addEventListener('click', saveEdit);
    document.getElementById('btn-save-edit-2').addEventListener('click', saveEdit);
    document.getElementById('btn-delete-edit').addEventListener('click', function () {
      askConfirm('Delete this filament from the inventory?', 'Delete', function () {
        var idx = findItemIndex(editingId);
        if (idx !== -1) state.items.splice(idx, 1);
        saveItems();
        closePanel('panel-edit');
        closePanel('panel-confirm');
        renderAll();
        toast('Deleted');
      });
    });
    document.getElementById('btn-confirm-no').addEventListener('click', function () {
      closePanel('panel-confirm');
      confirmCb = null;
    });
    document.getElementById('btn-confirm-yes').addEventListener('click', function () {
      var cb = confirmCb;
      confirmCb = null;
      closePanel('panel-confirm');
      if (cb) cb();
    });
    document.getElementById('btn-cam-cancel').addEventListener('click', function () { finishCamera(false); });
    document.getElementById('btn-cam-use').addEventListener('click', function () { finishCamera(true); });
    document.getElementById('file-camera').addEventListener('change', function () {
      if (this.files && this.files[0]) loadPhotoFile(this.files[0]);
    });
    document.getElementById('file-import').addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () { importCsvText(String(reader.result || '')); };
      reader.readAsText(file);
    });
    document.body.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.getAttribute && t.getAttribute('data-close')) {
        var id = t.getAttribute('data-close');
        if (id === 'panel-edit') {
          var it = findItem(editingId);
          if (it && isBlankNewItem(it)) {
            var idx = findItemIndex(editingId);
            if (idx !== -1) {
              state.items.splice(idx, 1);
              saveItems();
              renderAll();
            }
          }
        }
        closePanel(id);
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        var ids = ['panel-confirm', 'panel-scan', 'panel-camera', 'panel-csv', 'panel-settings', 'panel-rapid', 'panel-edit'];
        var i;
        for (i = 0; i < ids.length; i++) {
          if (document.getElementById(ids[i]).className.indexOf('is-open') !== -1) {
            if (ids[i] === 'panel-camera') finishCamera(false);
            else if (ids[i] === 'panel-scan') closeScanPanel();
            else closePanel(ids[i]);
            return;
          }
        }
      }
    });
  }
  function featureChecks() {
    return {
      localStorage: (function () { try { localStorage.setItem('__fi_t', '1'); localStorage.removeItem('__fi_t'); return true; } catch (e) { return false; } })(),
      serviceWorker: 'serviceWorker' in navigator,
      share: typeof navigator.share === 'function',
      shareFiles: !!(navigator.canShare),
      fileConstructor: typeof File === 'function',
      clipboard: !!(navigator.clipboard && navigator.clipboard.writeText),
      pointerEvents: 'PointerEvent' in window,
      canvas: !!(document.createElement('canvas').getContext),
      matchMedia: typeof window.matchMedia === 'function',
      barcodeDetector: 'BarcodeDetector' in window,
      getUserMedia: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
      vibrate: typeof navigator.vibrate === 'function',
      zxing: typeof window.ZXing !== 'undefined'
    };
  }
  function init() {
    loadSettings();
    loadItems();
    applyTheme();
    bind();
    renderAll();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
    window.FilamentApp = {
      samplePatch: samplePatch,
      nearestColorName: nearestColorName,
      gainsFromReference: gainsFromReference,
      toCSV: toCSV,
      parseCSV: parseCSV,
      itemsFromCSV: itemsFromCSV,
      hexToRgb: hexToRgb,
      rgbToHex: rgbToHex,
      normalizeHex: normalizeHex,
      seedList: seedList,
      CSV_HEADERS: CSV_HEADERS,
      parseWeightInput: parseWeightInput,
      applyWeightValue: applyWeightValue,
      todayISO: todayISO,
      weightPctLabel: weightPctLabel,
      COLOR_NAMES: COLOR_NAMES,
      getState: function () { return state; },
      saveItems: saveItems,
      loadItems: loadItems,
      renderAll: renderAll,
      featureChecks: featureChecks,
      downscaleImageToCanvas: downscaleImageToCanvas,
      PHOTO_MAX: PHOTO_MAX,
      PATCH: PATCH,
      openCameraUI: openCameraUI,
      startCamera: startCamera,
      parseBarcodePayload: parseBarcodePayload,
      findItemByBarcode: findItemByBarcode,
      applyParsedFields: applyParsedFields,
      applyScannedCode: applyScannedCode,
      handleScannedPayload: handleScannedPayload,
      renderEdit: renderEdit,
      decodeFromCanvas: decodeFromCanvas,
      openScanPanel: openScanPanel,
      closeScanPanel: closeScanPanel,
      startNewFromScan: startNewFromScan,
      mapMaterial: mapMaterial,
      getSticky: function () { return rapidSticky; }
    };
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
